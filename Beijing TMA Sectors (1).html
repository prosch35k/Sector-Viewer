<style>
/* Layout: controls on top, sector map on the left, altitude profile and sector info for the selected point on the right. Stacks on narrow screens. */
:root {
  color-scheme: dark;
  --bg: #0b0b0b;
  --surface: #151515;
  --ink: #ebebeb;
  --muted: #9b9b9b;
  --line: #2b2b2b;
  --grid: #1f1f1f;
  --map: #101010;
  --accent: #c8362f;
  --accent-ink: #ffffff;
  --accent-soft: #3b1815;
  --k1: #5aa0d6; --k2: #6cbf78; --k3: #ee9f4f; --k4: #b58ae0; --k5: #e87aa8; --k6: #4cc4b6;
  --k7: #e8766c; --k8: #b9d04d; --k9: #a3b0bc; --k10: #e2c24c; --k11: #8a9ee8; --k12: #c99a74;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 36px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font: 500 12px var(--font-data); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 700 clamp(32px, 6vw, 48px)/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 22px; align-items: start; }
.ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font: 500 11px var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.readout { font: 500 15px var(--font-data); font-variant-numeric: tabular-nums; }
.readout span { color: var(--muted); font-weight: 400; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1 1 auto; font: 500 12.5px var(--font-data); padding: 7px 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; text-align: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.unit { display: inline-flex; align-self: flex-start; }
.seg.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
.seg.grid2 button, .seg.grid2 button + button { border: 0; border-bottom: 1px solid var(--line); padding: 9px 10px; }
.seg.grid2 button:nth-child(odd) { border-right: 1px solid var(--line); }
.seg.grid2 button:nth-child(n+3) { border-bottom: 0; }
.rwy { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 18px 28px; }
.ap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ap-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.ap-h h2 { font-size: 20px; }
.ap-set { font: 400 12.5px var(--font-data); color: var(--muted); }
.ap-set b { color: var(--ink); font-weight: 500; }
.rrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.rrow .role-l { flex: 0 0 34px; font: 500 11px var(--font-data); letter-spacing: .1em; color: var(--muted); }
.rgrp { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.rgrp + .rgrp { padding-left: 10px; border-left: 1px solid var(--line); }
.gtag { font: 500 10px var(--font-data); letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
.rb { font: 500 12.5px var(--font-data); padding: 5px 9px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.rb[aria-pressed="true"] { color: var(--ink); }
.rb.arr[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rb.dep[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.mode { align-self: flex-start; }
.mode button { padding: 4px 9px; font-size: 12px; }
button:focus-visible, input:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#map { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; max-width: 100%; cursor: crosshair; border: 1px solid var(--line); border-radius: 4px; touch-action: manipulation; }
.mapbg { fill: var(--map); }
.gl-line { stroke: var(--grid); stroke-width: 1; }
.gl { font: 400 10px var(--font-data); fill: var(--muted); }
.tma { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 9 5; pointer-events: none; }
.tma-t { font: 500 11px var(--font-data); fill: var(--muted); letter-spacing: .06em; }
.sec { fill: var(--sc); fill-opacity: .26; stroke: var(--sc); stroke-width: 1.5; }
.sec:not(.on) { display: none; }
.sec.all { fill-opacity: .14; }
.sec.all.sel { fill-opacity: .3; }
.sec-line { fill: none; stroke: var(--sc); stroke-width: 1.2; pointer-events: none; }
.lab .f { font: 400 9px var(--font-data); letter-spacing: 0; }
.ctl.off { opacity: .45; }
.sec.sel { fill-opacity: .46; stroke-width: 3; }
.lab { text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--map); stroke-width: 3px; stroke-linejoin: round; fill: var(--ink); }
.lab .n { font: 500 13px var(--font-display); letter-spacing: .05em; }
.apt-dot { fill: var(--ink); }
.apt { font: 500 11px var(--font-data); fill: var(--ink); paint-order: stroke; stroke: var(--map); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.pin circle { fill: none; stroke: var(--accent); stroke-width: 2; }
.pin line { stroke: var(--accent); stroke-width: 2; }
.pin .halo { stroke: var(--map); stroke-width: 5; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink); font: 500 13px var(--font-body); cursor: pointer; opacity: .6; }
.chip .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--sc); flex: none; }
.chip small { font: 400 11px var(--font-data); color: var(--muted); }
.chip.on { opacity: 1; border-color: var(--sc); }

h2 { margin: 0; font: 600 22px/1.1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
.phead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.coord { font: 400 13px var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.splits { margin: 0; font: 400 13px var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.splits b { color: var(--ink); font-weight: 500; }

.col svg { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; }
.ax { font: 400 11px var(--font-data); fill: var(--muted); font-variant-numeric: tabular-nums; }
.tick { stroke: var(--grid); stroke-width: 1; }
.bar { fill: var(--sc); fill-opacity: .28; stroke: var(--sc); stroke-width: 1.5; }
.bar.sel { fill-opacity: .5; stroke-width: 3; }
.bfill { fill: var(--sc); fill-opacity: .28; }
.bout { fill: none; stroke: var(--sc); stroke-width: 1.5; }
.bn { font: 600 16px var(--font-display); letter-spacing: .04em; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.bb { font: 400 10.5px var(--font-data); fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hatch-line { stroke: var(--line); stroke-width: 1; }
.gapr { fill: url(#hatch); stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.note-t { font: 400 11px var(--font-body); fill: var(--muted); }
.cut { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 3; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 500 11px var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 6px 6px; }
td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
tr[tabindex] { cursor: pointer; }
td.fq { font: 500 14px var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.band { font: 500 13px var(--font-data); font-variant-numeric: tabular-nums; }

.nm { display: flex; align-items: center; gap: 8px; font-weight: 600; }

.role { display: block; color: var(--muted); font-size: 13px; padding-left: 18px; }

.empty { color: var(--muted); margin: 0; }

.calt { font: 400 12.5px var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }

.notice { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; max-width: 100ch; display: flex; flex-direction: column; gap: 6px; }

.notice b { color: var(--ink); font-weight: 600; }

    </aside>
  </div>
</div>

    var zs = s.zones.filter(function (z) { return !z.empty; });
    var uniform = zs.every(function (z) { return z.lo === zs[0].lo && z.hi === zs[0].hi && z.loRef === zs[0].loRef && z.hiRef === zs[0].hiRef; });
    var o = head;
    o += '<div class="cname" style="--sc:' + col(s) + '"><span class="dot"></span><b>' + esc(s.id) + '</b><span class="m">' + esc(s.call) + '</span></div>';
    o += '<dl class="kv"><dt>Conditions</dt><dd>' + (s.cfg ? 'RWY ' + esc(RW[s.cfg[0]][s.cfg[1]]) + ' in use at ' + s.cfg[0] : 'None') + '</dd>' +
      (s.remark ? '<dt>Remark</dt><dd>' + esc(s.remark) + '</dd>' : '') + '</dl>';
    o += coordBlock('Outline', uniform ? altOf(zs[0]) : '', '', s.baseP);
    if (!uniform) {
      zs.forEach(function (z) {
        var title = z.kind || 'Sub-area', sub = '', pts;
        if (z.area == null) { sub = 'The sector outline outside the sub-areas listed here.'; o += '<div class="cblock"><div class="chead"><span class="ctitle">' + esc(title) + '</span><span class="calt">' + esc(altOf(z)) + '</span></div><p class="csub">' + sub + '</p></div>'; return; }
        o += coordBlock(title, altOf(z), sub, z.poly);
      });
    }
    if (s.note) o += '<p class="fine">' + esc(s.note) + '</p>';
    return o;
  }
  var coordsBox = document.getElementById('coords');
  coordsBox.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-cp]'); if (!b) return;
    var txt = copyBuf[+b.getAttribute('data-cp')];
    function flash(t) { b.textContent = t; setTimeout(function () { b.textContent = 'Copy'; }, 1400); }
    function pick() {
      try {
        var pre = b.closest('.cblock').querySelector('pre'), r = document.createRange(), sl = window.getSelection();
        r.selectNodeContents(pre); sl.removeAllRanges(); sl.addRange(r);
      } catch (e) { /* ignore */ }
      flash('Selected');
    }
    try { navigator.clipboard.writeText(txt).then(function () { flash('Copied'); }, pick); } catch (e) { pick(); }
  });

  /* ---------- Render ---------- */
  function render() {
    var u = state.unit, h = state.alt;
    document.getElementById('altOut').innerHTML = state.view === 'all' ? 'All altitudes' : esc(num(h, u)) + ' <span>· ' + esc(num(h, other(u))) + '</span>';
    altIn.disabled = state.view === 'all';
    document.getElementById('altCtl').className = 'ctl' + (state.view === 'all' ? ' off' : '');
    VIEWS.forEach(function (v) { document.getElementById('vw-' + v[0]).setAttribute('aria-pressed', state.view === v[0] ? 'true' : 'false'); });
    updateSets();
    FILTERS.forEach(function (f) { document.getElementById('flt-' + f[0].split(' ')[0]).setAttribute('aria-pressed', state.filter === f[0] ? 'true' : 'false'); });
    Object.keys(RWY).forEach(function (ap) {
      ['ARR', 'DEP'].forEach(function (role) {
        ['N', 'S'].forEach(function (f) {
          RWY[ap][f].forEach(function (rw) { document.getElementById('rw-' + ap + '-' + role + '-' + rw).setAttribute('aria-pressed', state.use[ap][role][rw] ? 'true' : 'false'); });
        });
      });
      ['auto', 'N', 'S'].forEach(function (m) { document.getElementById('mode-' + ap + '-' + m).setAttribute('aria-pressed', state.mode[ap] === m ? 'true' : 'false'); });
      document.getElementById('info-' + ap).innerHTML = 'Sector set <b>' + state.sets[ap].join(' + ') + '</b> · ' + esc(state.why[ap]);
    });

    var layers = layersAt(state.pt);
    var act = state.view === 'all' ? layers.slice().sort(function (p, q) { return p.lo - q.lo; }) : layers.filter(function (l) { return l.lo <= h && h < l.hi; });
    var selL = act.filter(function (l) { return l.s.id === state.sel; })[0] || act[0] || null;
    var selId = selL ? selL.s.id : null;

    rbCache = {};
    var oldLabs = Array.prototype.slice.call(gLab.childNodes), changed = {};
    while (gLab.firstChild) gLab.removeChild(gLab.firstChild);
    var all = state.view === 'all', chips = '', labItems = [];
    SECTORS.forEach(function (s) {
      var g = secG[s.id], on = cfgOn(s) && visible(s);
      if (!on) {
        var pv0 = secPrev[s.id];
        if (pv0 && pv0.d) { changed[s.id] = true; ghostOut(s, pv0); }
        secPrev[s.id] = null; g.setAttribute('display', 'none'); return;
      }
      g.removeAttribute('display');
      var p = secPath[s.id], ln = secLine[s.id], has = false, lp, q, t;
      if (all) {
        var pcs = piecesOf(s), U = GEO.unionAll(pcs.map(function (c) { return c.R; }));
        has = pcs.length > 0;
        if (has) {
          p.setAttribute('d', ringsD(U));
          p.setAttribute('class', 'sec on all' + (s.id === selId ? ' sel' : ''));
          ln.setAttribute('d', pcs.map(function (c) { return ringsD(c.R); }).join(''));
          secTitle[s.id].textContent = s.id + ' · ' + s.call + ' · ' + pcs.map(function (c) { return c.txt; }).join(' / ');
          labItems.push({ k: 'n', text: s.id, sid: s.id, E: U });
        }
      } else {
        ln.setAttribute('d', '');
        var R = regionOf(s, h);
        has = R.length > 0;
        if (has) {
          p.setAttribute('d', ringsD(R));
          p.setAttribute('class', 'sec on' + (s.id === selId ? ' sel' : ''));
          secTitle[s.id].textContent = s.id + ' · ' + s.call + ' · ' + s.zones.filter(function (z) { return z.lo <= h && h < z.hi; }).map(function (z) { return band(z, 'm'); }).join(' / ');
          lp = GEO.labelPoint(R);
          if (lp) {
            q = px(lp); t = el('text', { x: q[0], y: q[1] + 4, 'class': 'lab', 'data-sid': s.id }, gLab);
            el('tspan', { x: q[0], 'class': 'n' }, t).textContent = s.id;
          }
        }
      }
      if (!has) { p.setAttribute('d', ''); p.setAttribute('class', 'sec'); ln.setAttribute('d', ''); }
      var nd = has ? p.getAttribute('d') : '', nl = has ? ln.getAttribute('d') : '', pv = secPrev[s.id];
      if (!pv || pv.d !== nd || pv.ld !== nl) {
        changed[s.id] = true;
        if (pv && pv.d) ghostOut(s, pv);
        if (has) { fade(p, 0, 1); if (nl) fade(ln, 0, 1); }
      }
      secPrev[s.id] = { d: nd, ld: nl, cls: p.getAttribute('class') };
      chips += '<button type="button" class="chip' + (has ? ' on' : '') + '" data-id="' + s.id + '" style="--sc:' + col(s) + '"><span class="dot"></span>' + esc(s.id) + '</button>';
    });
    if (all) placeLabels(labItems);
    Array.prototype.forEach.call(gLab.childNodes, function (n) { if (changed[n.getAttribute('data-sid')]) fade(n, 0, 1); });
    oldLabs.forEach(function (n) {
      var sid = n.getAttribute && n.getAttribute('data-sid');
      if (sid && changed[sid]) { gGhostLab.appendChild(n); fade(n, 1, 0, function () { if (n.parentNode) n.parentNode.removeChild(n); }); }
    });
    chipBox.innerHTML = chips;

    var q = px(state.pt);
    pin.setAttribute('transform', 'translate(' + q[0].toFixed(1) + ',' + q[1].toFixed(1) + ')');
    var g = fromNm(state.pt.x, state.pt.y);
    document.getElementById('coord').textContent = dm(g.lat, 'N', 'S', 2) + ' ' + dm(g.lon, 'E', 'W', 3);

    var selKey = selL ? selL.s.id + ':' + selL.lo : '';
    coordsBox.innerHTML = coordsHtml(selL ? selL.s : null);
    document.getElementById('colSvg').innerHTML = column(layers, u, selKey);

    var bounds = {};
    layers.forEach(function (s) { bounds[s.lo + '|' + s.loRef] = 1; bounds[s.hi + '|' + s.hiRef] = 1; });
    var bl = Object.keys(bounds).map(function (k) { var a = k.split('|'); return { m: +a[0], r: a[1] }; }).filter(function (b) { return b.m > 0; }).sort(function (a, b) { return a.m - b.m; });
    document.getElementById('splits').innerHTML = bl.length
      ? 'Split levels here: ' + bl.map(function (b) { return '<b>' + esc(lim(b.m, b.r, u)) + '</b>'; }).join(' · ')
      : 'This point is outside the Beijing APP sectors.';

    var rows = layers.slice().sort(function (a, b) { return b.lo - a.lo || b.hi - a.hi; }).map(function (L) {
      var s = L.s, key = s.id + ':' + L.lo;
      return '<tr tabindex="0" data-sid="' + s.id + '" data-lo="' + L.lo + '" data-hi="' + L.hi + '" data-mid="' + (Math.round((L.lo + L.hi) / 2 / 300) * 300) + '" class="' + (key === selKey ? 'is-sel' : '') + '">' +
        '<td><span class="nm" style="--sc:' + col(s) + '"><span class="dot"></span>' + esc(s.id) + '</span><span class="role">' + esc(s.call) + '</span></td>' +
        '<td class="fq">' + esc(s.freq) + '</td>' +
        '<td class="band">' + esc(band(L, u)) + '<small>' + esc(band(L, other(u))) + '</small></td></tr>';
    }).join('');
    rowsBox.innerHTML = rows || '<tr><td colspan="3"><p class="empty">No sectors cover this point. Click inside the TMA boundary (dashed line).</p></td></tr>';

    var det = document.getElementById('detail');
    if (!selL) {
      det.innerHTML = '<p class="empty">' + (layers.length ? 'No sector at the selected altitude at this point. Move the altitude slider or pick a row in the table.' : 'Click a sector on the map to see its name, frequency and altitudes.') + '</p>';
    } else {
      var s = selL.s, zs = '';
      s.zones.forEach(function (z) {
        if (z.empty) return;
        var lab = s.zones.length > 1 ? (z.kind || '') : '';
        zs += '<div>' + (lab ? esc(lab) + ': ' : '') + esc(band(z, u)) + '</div>';
      });
      det.innerHTML =
        '<h3 style="--sc:' + col(s) + '"><span class="dot"></span>' + esc(s.id) + ' <span class="call">' + esc(s.call) + '</span></h3>' +
        '<div class="freq">' + esc(s.freq) + '<small>MHz</small></div>' +
        '<dl class="kv"><dt>Backup</dt><dd>' + esc(s.sec) + ' MHz</dd>' +
        '<dt>Service</dt><dd>Beijing APP · ' + esc(hoursTxt(s.hours)) + '</dd>' +
        '<dt>Applies</dt><dd>' + esc(cfgText(s)) + '</dd>' +
        '<dt>Altitudes</dt><dd>' + zs + '</dd>' +
        (s.remark ? '<dt>Remark</dt><dd>' + esc(s.remark) + '</dd>' : '') + '</dl>' +
        (s.note ? '<p class="fine">' + esc(s.note) + '</p>' : '');
    }
  }
  render();
})();
</script>

</body></html>
